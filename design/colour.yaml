pageBackgrounds:
  defaultLight: "linear-gradient(180deg, #f8fafc, #ffffff)"
  defaultDark: "linear-gradient(180deg, #020617, #0f172a)"
  homeLight: "radial-gradient(950px 560px at 5% -10%, rgba(14, 165, 233, 0.12), transparent 60%), radial-gradient(760px 440px at 100% 0%, rgba(34, 197, 94, 0.10), transparent 55%), linear-gradient(180deg, #f8fbff, #ffffff 58%, #f8fafc)"
  homeDark: "radial-gradient(950px 560px at 5% -10%, rgba(14, 165, 233, 0.15), transparent 60%), radial-gradient(760px 440px at 100% 0%, rgba(34, 197, 94, 0.11), transparent 55%), linear-gradient(180deg, #020617, #0f172a 52%, #111827)"
  dashboardLight: "radial-gradient(880px 520px at 8% -10%, rgba(56, 189, 248, 0.18), transparent 60%), radial-gradient(760px 460px at 100% 0%, rgba(186, 230, 253, 0.48), transparent 60%), linear-gradient(180deg, #f4fbff, #f8fbff 58%, #f8fafc)"
  dashboardDark: "radial-gradient(880px 520px at 8% -10%, rgba(14, 165, 233, 0.16), transparent 58%), radial-gradient(720px 460px at 100% 0%, rgba(34, 197, 94, 0.10), transparent 56%), linear-gradient(180deg, #020617, #0f172a 54%, #111827)"
dashboard:
  headerLight: linear-gradient(135deg, rgba(186, 230, 253, 0.98), rgba(224, 242, 254, 0.95) 52%, rgba(240, 249, 255, 0.98))
  headerDark: linear-gradient(140deg, rgba(7, 89, 133, 0.44), rgba(15, 23, 42, 0.94) 58%, rgba(17, 24, 39, 0.96))
  headerBorderLight: rgba(125, 211, 252, 0.34)
  headerBorderDark: rgba(125, 211, 252, 0.14)
  online:
    color: "#059669"
    background: rgba(16, 185, 129, 0.14)
    border: rgba(16, 185, 129, 0.24)
  offline:
    color: "#dc2626"
    background: rgba(239, 68, 68, 0.14)
    border: rgba(239, 68, 68, 0.24)
  profile:
    avatarBackground: "#facc15"
    avatarText: "#111827"
  overlay: rgba(2, 6, 23, 0.42)
  libraryFavorites:
    color: "#2563eb"
    backgroundLight: rgba(37, 99, 235, 0.10)
    backgroundDark: rgba(37, 99, 235, 0.18)
    border: rgba(37, 99, 235, 0.22)
  libraryOffline:
    color: "#7c3aed"
    backgroundLight: rgba(124, 58, 237, 0.10)
    backgroundDark: rgba(124, 58, 237, 0.18)
    border: rgba(124, 58, 237, 0.22)
  sections:
    interview:
      accent: "#f43f5e"
      surfaceLight: linear-gradient(135deg, rgba(255, 228, 230, 0.78), rgba(255, 255, 255, 0.96))
      surfaceDark: linear-gradient(135deg, rgba(136, 19, 55, 0.48), rgba(15, 23, 42, 0.96))
    courses:
      accent: "#2563eb"
      surfaceLight: linear-gradient(135deg, rgba(191, 219, 254, 0.76), rgba(255, 255, 255, 0.96))
      surfaceDark: linear-gradient(135deg, rgba(30, 64, 175, 0.34), rgba(15, 23, 42, 0.96))
    cbt:
      accent: "#ea580c"
      surfaceLight: linear-gradient(135deg, rgba(254, 215, 170, 0.78), rgba(255, 255, 255, 0.96))
      surfaceDark: linear-gradient(135deg, rgba(154, 52, 18, 0.34), rgba(15, 23, 42, 0.96))
courses:
  cardBackgroundLight: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.98))
  cardBackgroundDark: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.92))
  categoryTones:
    frontend:
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(14, 165, 233, 0.08))
      border: rgba(37, 99, 235, 0.26)
      color: "#2563eb"
    database:
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.18), rgba(34, 197, 94, 0.08))
      border: rgba(14, 165, 233, 0.24)
      color: "#0284c7"
    backend:
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.18), rgba(245, 158, 11, 0.08))
      border: rgba(249, 115, 22, 0.26)
      color: "#ea580c"
    full stack:
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.18), rgba(59, 130, 246, 0.08))
      border: rgba(168, 85, 247, 0.26)
      color: "#7c3aed"
    default:
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.18), rgba(16, 185, 129, 0.08))
      border: rgba(34, 197, 94, 0.26)
      color: "#15803d"
landing:
  heroAccentGradient: "linear-gradient(135deg, #2563eb, #16a34a)"
  features:
    structuredCourses:
      gradient: linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(14, 165, 233, 0.06))
      iconBg: rgba(37, 99, 235, 0.12)
      iconColor: "#2563eb"
    interviewPractice:
      gradient: linear-gradient(135deg, rgba(168, 85, 247, 0.12), rgba(139, 92, 246, 0.06))
      iconBg: rgba(168, 85, 247, 0.12)
      iconColor: "#a855f7"
    offlineReady:
      gradient: linear-gradient(135deg, rgba(34, 197, 94, 0.12), rgba(16, 185, 129, 0.06))
      iconBg: rgba(34, 197, 94, 0.12)
      iconColor: "#16a34a"
    cbtHub:
      gradient: linear-gradient(135deg, rgba(249, 115, 22, 0.12), rgba(245, 158, 11, 0.06))
      iconBg: rgba(249, 115, 22, 0.12)
      iconColor: "#ea580c"
ticker:
  jobs:
    borderColor: rgba(34, 197, 94, 0.35)
    color: "#166534"
  trending-technologies:
    borderColor: rgba(37, 99, 235, 0.35)
    color: "#1d4ed8"
  events:
    borderColor: rgba(249, 115, 22, 0.35)
    color: "#c2410c"
mobile:
  quickNavSurfaceLight: rgba(255, 255, 255, 0.92)
  quickNavSurfaceDark: rgba(15, 23, 42, 0.92)
  quickNavBorderLight: rgba(15, 23, 42, 0.10)
  quickNavBorderDark: rgba(148, 163, 184, 0.20)
  quickNavShadowLight: 0 12px 30px rgba(15, 23, 42, 0.14)
  quickNavShadowDark: 0 12px 30px rgba(2, 6, 23, 0.36)
