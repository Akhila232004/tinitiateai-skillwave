template: text
defaults:
  textAlign: left
  titleSize: clamp(30px, 4.4vw, 56px)
  bodySize: clamp(15px, 1.5vw, 18px)
topics:
  - id: java-core
    title: Java Core
    label: Interview topic
    accent: var(--dashboard-section-courses-accent)
    imageSurface: linear-gradient(135deg, color-mix(in srgb, var(--dashboard-section-courses-accent) 18%, var(--surface)), color-mix(in srgb, var(--brand) 12%, var(--surface)))
    slides:
      - eyebrow: Concept
        title: Object-oriented basics
        body: Classes model state and behavior. Interfaces describe contracts. Composition keeps code flexible when requirements change.
      - eyebrow: Practice
        title: Collections and iteration
        body: Pick the collection around lookup, ordering, and duplicate needs. Explain tradeoffs before jumping into syntax.
        textAlign: center
        titleSize: clamp(28px, 4vw, 50px)
      - eyebrow: Review
        title: Exceptions and flow
        body: Use checked exceptions for recoverable cases and runtime exceptions for programming errors. Keep catch blocks useful.
