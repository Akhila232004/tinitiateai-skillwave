template: image
defaults:
  imageSize: clamp(190px, 23vw, 280px)
  mobileImageSize: clamp(150px, 48vw, 210px)
topics:
  - id: vue-js
    title: Vue JS
    label: Revision topic
    accent: var(--dashboard-section-cbt-accent)
    imageSurface: linear-gradient(135deg, color-mix(in srgb, var(--dashboard-section-cbt-accent) 18%, var(--surface)), color-mix(in srgb, var(--brand) 10%, var(--surface)))
    imagePath: design/course-icons/vue-js.svg
    slides:
      - eyebrow: Concept
        title: Start with constraints
        body: Clarify users, traffic, latency, storage, and failure expectations first. The architecture should answer those numbers.
        imageAlt: Vue JS topic visual
      - eyebrow: Practice
        title: Separate reads and writes
        body: Different paths can scale differently. Caches, queues, replicas, and indexes each solve a specific pressure point.
        imageAlt: Vue JS practice visual
        imageSize: clamp(210px, 25vw, 300px)
      - eyebrow: Review
        title: Name the tradeoff
        body: Every design buys something and spends something else. Call out cost, complexity, freshness, and operational risk.
        imageAlt: Vue JS review visual
