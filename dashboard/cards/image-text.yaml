template: imageText
defaults:
  imagePosition: left
  textAlign: left
  imageSize: clamp(140px, 15vw, 184px)
  mobileImageSize: clamp(112px, 34vw, 150px)
  titleSize: clamp(28px, 4vw, 52px)
  bodySize: clamp(15px, 1.45vw, 18px)
topics:
  - id: sql-querying
    title: SQL Querying
    label: Course topic
    accent: var(--dashboard-section-interview-accent)
    imageSurface: linear-gradient(135deg, color-mix(in srgb, var(--dashboard-section-interview-accent) 18%, var(--surface)), color-mix(in srgb, var(--brand-2) 12%, var(--surface)))
    imagePath: design/course-icons/sql-server.webp
    slides:
      - eyebrow: Concept
        title: Filter before grouping
        body: WHERE limits rows before aggregation. HAVING filters grouped results. That order explains many interview query bugs.
        imageAlt: SQL filtering topic visual
        imagePosition: left
      - eyebrow: Practice
        title: Joins by intent
        body: Inner joins require matching rows. Left joins preserve the left side. Start from the table whose rows must survive.
        imageAlt: SQL joins topic visual
        imagePosition: right
      - eyebrow: Review
        title: Indexes and selectivity
        body: A good index helps the database find fewer rows faster. Low-selectivity columns often need a different strategy.
        imageAlt: SQL index topic visual
        imagePosition: top
        textAlign: center
        imageSize: clamp(132px, 13vw, 170px)
